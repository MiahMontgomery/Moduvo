<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Compatibility Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .warning { background: #fff3cd; color: #856404; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>AR Compatibility Test</h1>
    <div id="status"></div>
    <button onclick="testAR()">Test AR Support</button>
    <button onclick="startAR()">Start AR Session</button>
    <div id="log"></div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            console.log(message);
        }

        function updateStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        async function testAR() {
            log('🔍 Testing AR compatibility...');
            
            // Check basic requirements
            const isHTTPS = location.protocol === 'https:';
            const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            log(`HTTPS: ${isHTTPS}`);
            log(`Mobile: ${isMobile}`);
            log(`User Agent: ${navigator.userAgent}`);
            
            if (!isHTTPS) {
                updateStatus('❌ HTTPS required for AR', 'error');
                return;
            }
            
            // Check WebXR support
            if ('xr' in navigator) {
                log('✅ WebXR API available');
                
                try {
                    const supported = await navigator.xr.isSessionSupported('immersive-ar');
                    log(`AR session supported: ${supported}`);
                    
                    if (supported) {
                        updateStatus('✅ AR fully supported!', 'success');
                    } else {
                        updateStatus('⚠️ WebXR available but AR not supported', 'warning');
                    }
                } catch (error) {
                    log(`AR session check failed: ${error}`);
                    updateStatus('⚠️ AR session check failed', 'warning');
                }
            } else {
                log('❌ WebXR not available');
                updateStatus('❌ WebXR not supported', 'error');
            }
            
            // Check camera access
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                log('✅ Camera access available');
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                log(`Camera access failed: ${error}`);
                updateStatus('❌ Camera access denied', 'error');
            }
        }

        async function startAR() {
            log('🚀 Attempting to start AR session...');
            
            try {
                if ('xr' in navigator) {
                    const session = await navigator.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['hit-test'],
                        optionalFeatures: ['dom-overlay', 'light-estimation'],
                    });
                    
                    log('✅ AR session started successfully!');
                    updateStatus('🎉 AR session active!', 'success');
                    
                    session.addEventListener('end', () => {
                        log('🛑 AR session ended');
                        updateStatus('AR session ended', 'warning');
                    });
                    
                } else {
                    log('❌ WebXR not available');
                    updateStatus('❌ Cannot start AR - WebXR not available', 'error');
                }
            } catch (error) {
                log(`AR session start failed: ${error}`);
                updateStatus(`❌ AR start failed: ${error.message}`, 'error');
            }
        }

        // Auto-test on load
        window.addEventListener('load', testAR);
    </script>
</body>
</html>
